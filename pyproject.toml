[project]
name = "bamboost-tui"
version = "0.1.0"
description = "A terminal user interface for bamboost. A tool to view and manage simulation data."
readme = "README.md"
authors = [
    { name = "florez", email = "florez@ethz.ch" }
]
requires-python = ">=3.10"
dependencies = [
    "bamboost",
    "sqlalchemy>=2.0.37",
    "textual>=1.0.0",
]

[project.scripts]
bamboost-tui = "bamboost_tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
reportOptionalMemberAccess = false
reportOptionalSubscript = false

[tool.uv.sources]
bamboost = { path = "../bamboost@next", editable = true }
textual-autocomplete = { path = "../../../dev/textual-autocomplete", editable = true }

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[dependency-groups]
dev = [
    "commitizen>=4.8.2",
    "textual-dev>=1.7.0",
]
